<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Business Directory for the West Cameroon Chamber of Commerce.">
    <meta name="author" content="Tatsa Zoho Noubosse Emmanuel">
    <title>Chamber Directory - West Cameroon</title>
    
    <!-- Favicon -->
    <link rel="icon" href="images/favicon.ico" type="image/x-icon">
    
    <!-- Open Graph Meta Tags for Facebook -->
    <meta property="og:title" content="West Cameroon Chamber of Commerce Directory">
    <meta property="og:description" content="Discover local businesses and organizations in the West region of Cameroon.">
    <meta property="og:image" content="https://tatsa-emmanuel.github.io/wdd231/chamber/images/chamber-social.jpg">
    <meta property="og:url" content="https://tatsa-emmanuel.github.io/wdd231/chamber/directory.html">
    <meta property="og:type" content="website">

    <!-- CSS Files (Normalize must come first) -->
    <link rel="stylesheet" href="styles/normalize.css">
    <link rel="stylesheet" href="styles/small.css">
    <link rel="stylesheet" href="styles/larger.css">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">

    <!-- JavaScript -->
    <script src="scripts/directory.js" defer></script>
</head>
<body>
    <header>
        <div class="header-container">
            <img src="images/chamber-logo.svg" alt="West Cameroon Chamber Logo" width="80" height="80">
            <div>
                <h1>West Cameroon</h1>
                <p>Chamber of Commerce</p>
            </div>
        </div>
        <button id="menu-btn" aria-label="Toggle Menu">☰</button>
    </header>

    <nav>
        <ul id="primary-nav">
            <li><a href="index.html">Home</a></li>
            <li><a href="discover.html">Discover</a></li>
            <li><a href="directory.html" class="active">Directory</a></li>
            <li><a href="join.html">Join</a></li>
        </ul>
    </nav>

    <main>
        <h2>Business Directory</h2>
        <div class="menu-controls">
            <button id="grid-btn" class="active-view" aria-label="Grid View">⏹ Grid</button>
            <button id="list-btn" aria-label="List View">📄 List</button>
        </div>
        
        <!-- The container for member cards -->
        <article id="directory-container" class="grid-view"></article>
    </main>

    <footer>
        <div class="footer-info">
            <div class="contact-info">
                <h3>West Cameroon Chamber of Commerce</h3>
                <p>100 Civic Center, Bafoussam, West, Cameroon</p>
                <p>info@westcamchamber.cm</p>
                <p>+237 6 00 00 00 00</p>
            </div>
            <div class="social-links">
                <a href="#"><img src="images/facebook-icon.svg" alt="Facebook" width="30" height="30"></a>
                <a href="#"><img src="images/linkedin-icon.svg" alt="LinkedIn" width="30" height="30"></a>
            </div>
        </div>
        <div class="course-info">
            <p>&copy; <span id="currentyear"></span> | Tatsa Zoho Noubosse Emmanuel | WDD 231 Project</p>
            <p id="lastModified"></p>
        </div>
    </footer>

</html>
