<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Book your language learning session.">
    <meta name="author" content="Tatsa Emmanuel">
    <title>Booking - ClearSpeak Hub</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css">
    
    <link rel="stylesheet" href="styles/base.css">
    <link rel="stylesheet" href="styles/larger.css">
    <script type="module" src="scripts/main.js" defer></script>
</head>
<body>
    <header class="site-header">
        <div class="header-container">
            <div class="brand">
                <img src="images/clearspeak-logo.svg" alt="ClearSpeak Hub Logo" width="180" height="45">
            </div>
            <nav class="main-nav">
                <button id="menu-btn" aria-label="Toggle Navigation">☰</button>
                <ul id="primary-nav">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="courses.html">Curriculum & Materials</a></li>
                    <li><a href="contact.html" class="active">Booking & Contact</a></li>
                </ul>
            </nav>
            <div class="header-actions">
                <button id="theme-toggle" aria-label="Toggle Dark Mode">🌓</button>
            </div>
        </div>
    </header>

    <main class="content-wrapper form-wrapper">
        <h1 class="text-center">Book a Free Lesson</h1>
        <form method="get" action="thankyou.html" class="contact-form">
            <label>First Name: <input type="text" name="fname" required></label>
            <label>Last Name: <input type="text" name="lname" required></label>
            <label>Email: <input type="email" name="email" required></label>
            <label>Language of Interest:
                <select name="subject" required>
                    <option value="" disabled selected>Select one...</option>
                    <option value="English">English</option>
                    <option value="French">French</option>
                </select>
            </label>
            <button type="submit" class="btn-primary submit-btn">Submit Request</button>
        </form>
    </main>

    <footer class="site-footer">
        <div class="footer-content">
            <div class="footer-info">
                <p><strong>ClearSpeak Hub</strong> | Bafoussam, Cameroon & Online</p>
            </div>
            <div class="footer-meta">
                <p>WDD231 Class Project | Tatsa Emmanuel</p>
                <p id="lastModified"></p>
                <p><a href="attributions.html">Resource Attributions</a> | <!-- <a href="#">Demo Video</a> --></p>
            </div>
        </div>
    </footer>
</body>
</html>
