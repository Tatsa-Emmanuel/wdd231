<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="View our full curriculum of English and French courses.">
    <meta name="author" content="Tatsa Emmanuel">
    <title>Curriculum - ClearSpeak Hub</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css">
    
    <link rel="stylesheet" href="styles/base.css">
    <link rel="stylesheet" href="styles/larger.css">
    <script type="module" src="scripts/courses.js" defer></script>
</head>
<body>
    <header class="site-header">
        <div class="header-container">
            <div class="brand">
                <img src="images/clearspeak-logo.svg" alt="ClearSpeak Hub Logo" width="180" height="45">
            </div>
            <nav class="main-nav">
                <button id="menu-btn" aria-label="Toggle Navigation">☰</button>
                <ul id="primary-nav">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="courses.html" class="active">Curriculum & Materials</a></li>
                    <li><a href="contact.html">Booking & Contact</a></li>
                </ul>
            </nav>
            <div class="header-actions">
                <button id="theme-toggle" aria-label="Toggle Dark Mode">🌓</button>
            </div>
        </div>
    </header>

    <main class="content-wrapper">
        <h1 class="text-center">Curriculum Overview</h1>
        
        <div class="filters">
            <button class="filter-btn btn-secondary" data-filter="all">All Levels</button>
            <button class="filter-btn btn-secondary" data-filter="english">English Programs</button>
            <button class="filter-btn btn-secondary" data-filter="french">French Programs</button>
        </div>

        <section id="courses-container" class="course-grid">
            <!-- Dynamically populated by JS -->
        </section>

        <!-- Native Modal -->
        <dialog id="course-modal">
            <h2 id="modal-title">Title</h2>
            <div id="modal-body"></div>
            <button id="modal-close" class="btn-primary">Close Details</button>
        </dialog>
    </main>

    <footer class="site-footer">
        <div class="footer-content">
            <div class="footer-info">
                <p><strong>ClearSpeak Hub</strong> | Bafoussam, Cameroon & Online</p>
            </div>
            <div class="footer-meta">
                <p>WDD231 Class Project | Tatsa Emmanuel</p>
                <p id="lastModified"></p>
                <p><a href="attributions.html">Resource Attributions</a> | <a href="#">Demo Video</a></p>
            </div>
        </div>
    </footer>
</body>
</html>
